openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone verification operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/otp/send:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendInput"
      responses:
        "200":
          description: Verification code accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSendResponse"
        "400":
          description: Invalid phone number
        "502":
          description: SMS provider error
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "400":
          description: Invalid code or phone number
        "502":
          description: SMS provider error
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OtpSendInput:
      type: object
      properties:
        phone:
          type: string
          description: Indian mobile number in 10-digit or E.164 format
          minLength: 10
      required:
        - phone
    OtpSendResponse:
      type: object
      properties:
        success:
          type: boolean
        expiresIn:
          type: integer
          description: Approximate verification code lifetime in seconds
      required:
        - success
        - expiresIn
    OtpVerifyInput:
      type: object
      properties:
        phone:
          type: string
          minLength: 10
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required:
        - phone
        - code
    OtpVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
      required:
        - verified

